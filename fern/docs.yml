# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: california-state-603082.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: family-905324
        branch: main
      launch: dashboard
title: California Family Code | Legal Research
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Home
    icon: home
  family-code:
    display-name: Family Code
    icon: scale
  changelog:
    display-name: Changelog
    icon: clock
navigation:
  - tab: home
    layout:
      - page: Home
        path: docs/pages/welcome.mdx
        slug: welcome
  - tab: family-code
    layout:
      - page: Family Code Overview
        path: docs/pages/family-code-overview.mdx
        icon: fa-regular fa-scale-balanced
      - section: Division 1
        contents:
          - page: Division 1 Overview
            path: docs/pages/family-code-division-1.mdx
            icon: fa-regular fa-landmark
          - page: Part 1 — Preliminary Provisions
            path: docs/pages/family-code-division-1.mdx
            icon: fa-regular fa-book
          - page: Part 2 — Definitions
            path: docs/pages/family-code-division-1.mdx
            icon: fa-regular fa-book
      - section: Division 20
        contents:
          - page: Division 20 Overview
            path: docs/pages/family-code-division-20.mdx
            icon: fa-regular fa-landmark
          - page: Family Court Services
            path: docs/pages/family-code-division-20.mdx
            icon: fa-regular fa-briefcase
      - section: Reference
        contents:
          - page: Search and citations
            path: docs/pages/support.mdx
            icon: fa-regular fa-file-lines
  - tab: changelog
    layout:
      - changelog: docs/changelog
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#FFFFFF"
    dark: "#323A45"
  background:
    light: "#FFFFFF"
    dark: "#323A45"
  border:
    light: "#FFFFFF"
    dark: "#323A45"
theme:
  page-actions: toolbar
  footer-nav: minimal
  tabs: bubble
logo:
  dark: docs/assets/logo-dark.png
  light: docs/assets/logo-light.png
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
js: custom.js
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
