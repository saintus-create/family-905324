name: Update Public Records Corpus

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggers

jobs:
  update-corpus:
    runs-name: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Extract Agency Data
        run: python scripts/extract_agencies.py

      - name: Build Unified Database
        run: python scripts/build_public_records_db.py

      - name: Generate MDX Pages
        run: python scripts/generate_public_records_docs.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add PUBLIC_RECORDS.json AGENCIES_EXTRACT.json fern/docs/pages/police-agencies.mdx fern/docs/pages/contractors.mdx
          git commit -m "chore: auto-update public records corpus [skip ci]" || exit 0
          git push
