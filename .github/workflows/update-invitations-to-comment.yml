name: update-invitations-to-comment
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  update-invitations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build active proposals catalog
        run: python scripts/update_invitations_to_comment.py
      - name: Commit updated proposals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/data/invitations-to-comment.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update invitations to comment"
          git push
