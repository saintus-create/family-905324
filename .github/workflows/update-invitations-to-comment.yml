name: Update Judicial Council invitations to comment

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-invitations-to-comment.yml"
      - "scripts/update_invitations_to_comment.py"

permissions:
  contents: write

concurrency:
  group: update-invitations-to-comment
  cancel-in-progress: false

jobs:
  update-proposals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF text dependency
        run: python -m pip install "pypdf==6.0.0"

      - name: Refresh active proposals from California Courts
        run: python scripts/update_invitations_to_comment.py

      - name: Commit updated proposals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/data/judicial/invitations-to-comment.json \
            fern/docs/pages/invitations-to-comment.mdx \
            fern/docs/pages/invitations-to-comment \
            fern/docs/assets/invitations-to-comment
          git diff --cached --quiet && exit 0
          git commit -m "chore: update invitations to comment"
          git pull --rebase
          git push
