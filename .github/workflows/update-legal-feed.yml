name: update-legal-feed
on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build feed from official California sources
        run: python scripts/update_legal_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/data/live-legal-feed.json fern/docs/pages/latest.mdx
          git diff --cached --quiet && exit 0
          git commit -m "chore: update California legal feed"
          git push
