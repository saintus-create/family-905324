name: update-california-legislation
on:
  schedule:
    - cron: "45 */4 * * *"
  workflow_dispatch:
jobs:
  update-legislation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build California legislation catalog
        run: python scripts/update_california_legislation.py
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fern/data/california-bills.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update California legislation catalog"
          git push
